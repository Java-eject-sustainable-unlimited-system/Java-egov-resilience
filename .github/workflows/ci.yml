name: J.E.S.U.S CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & Verify (Java 17)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK & Maven
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Verify Maven & Java Version
        run: |
          mvn -version
          java -version

      - name: Build & Test with Maven
        run: |
          echo "=================================================="
          echo " [✝️] Running J.E.S.U.S Maven Verify (Java 17)"
          echo "=================================================="
          mvn clean verify

          echo " [✨] Build, Packaging & Tests Successful!"
